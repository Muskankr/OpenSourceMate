# Link checker settings. Used by .github/workflows/links.yml and by running
# `lychee README.md 'docs/**/*.md'` locally from the repository root.
# Links to skip go in .lycheeignore.

no_progress = true
include_fragments = "anchor-only"

max_concurrency = 8
timeout = 30
max_retries = 3
retry_wait_time = 5

# 429 means the site is rate limiting us, not that the link is broken.
accept = ["200..=299", "429"]
