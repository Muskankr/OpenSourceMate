name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend Checks
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set Up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Check code formatting
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Type-Check
        run: npx tsc --noEmit

      - name: Run unit & integration tests with coverage
        run: npm run test:coverage -- --ci

      - name: Report Frontend Coverage Summary
        if: always()
        run: |
          echo "### 🎨 Frontend Coverage Summary" >> $GITHUB_STEP_SUMMARY
          if [ -f coverage/coverage-summary.json ]; then
            node -e "
              const fs = require('fs');
              const data = JSON.parse(fs.readFileSync('coverage/coverage-summary.json', 'utf8'));
              const total = data.total;
              console.log('| Metric | Percentage | Covered / Total |');
              console.log('| :--- | :--- | :--- |');
              console.log(\`| Lines | \${total.lines.pct}% | \${total.lines.covered} / \${total.lines.total} |\`);
              console.log(\`| Statements | \${total.statements.pct}% | \${total.statements.covered} / \${total.statements.total} |\`);
              console.log(\`| Functions | \${total.functions.pct}% | \${total.functions.covered} / \${total.functions.total} |\`);
              console.log(\`| Branches | \${total.branches.pct}% | \${total.branches.covered} / \${total.branches.total} |\`);
              console.log('\n*Thresholds enforced: 50% statements, 50% branches, 50% functions, 50% lines*');
            " >> $GITHUB_STEP_SUMMARY
          fi

      - name: Upload frontend coverage artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: frontend-coverage-report
          path: frontend/coverage/
          if-no-files-found: ignore

      - name: Production build
        run: npm run build

      - name: Check JavaScript bundle size against budgets
        run: npm run check:bundle-budget

  performance:
    name: Lighthouse CI & Performance Budgets
    runs-on: ubuntu-latest
    needs: [frontend]

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set Up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build Next.js application
        run: npm run build
        env:
          NEXT_PUBLIC_USE_MOCKS: "true"

      - name: Run Lighthouse CI
        run: |
          npx @lhci/cli@0.14.x autorun --config=lighthouserc.json
        env:
          LHCI_GITHUB_APP_TOKEN: ${{ secrets.LHCI_GITHUB_APP_TOKEN }}

      - name: Publish Lighthouse Step Summary
        if: always()
        run: |
          echo "### ⚡ Lighthouse Performance & Accessibility Scores" >> $GITHUB_STEP_SUMMARY
          echo "| Page / Target | Performance | Accessibility | Best Practices | SEO |" >> $GITHUB_STEP_SUMMARY
          echo "| :--- | :---: | :---: | :---: | :---: |" >> $GITHUB_STEP_SUMMARY
          echo "| Home / Analyzer (\`/\`) | >= 80% | >= 90% | >= 85% | >= 85% |" >> $GITHUB_STEP_SUMMARY
          echo "| Results Page (\`/?user=octocat\`) | >= 80% | >= 90% | >= 85% | >= 85% |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "*Configured in \`frontend/lighthouserc.json\`*" >> $GITHUB_STEP_SUMMARY

  backend:
    name: Backend tests
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-directory: backend/requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Validate generated OpenAPI schema
        run: python -m app.openapi_validation

      - name: Lint with ruff
        run: ruff check .

      - name: Check formatting with ruff
        run: ruff format --check .

      - name: Type check with mypy
        run: mypy app --config-file mypy.ini

      - name: Run tests with coverage
        run: python -m pytest -v --cov=app --cov-report=term-missing --cov-report=xml:coverage.xml --cov-report=html:htmlcov --cov-fail-under=80

      - name: Run Schemathesis API contract tests
        run: python -m pytest -v tests/test_schemathesis_contract.py

      - name: Report Backend Coverage Summary
        if: always()
        run: |
          echo "### 📊 Backend Coverage Summary" >> $GITHUB_STEP_SUMMARY
          if [ -f coverage.xml ]; then
            python -c "
          import xml.etree.ElementTree as ET
          try:
              tree = ET.parse('coverage.xml')
              root = tree.getroot()
              line_rate = float(root.attrib.get('line-rate', 0)) * 100
              branch_rate = float(root.attrib.get('branch-rate', 0)) * 100
              print('| Metric | Coverage | Threshold | Status |')
              print('| :--- | :--- | :--- | :--- |')
              status = '✅ PASS' if line_rate >= 80 else '❌ FAIL'
              print(f'| Line Coverage | {line_rate:.2f}% | 80.0% | {status} |')
              print(f'| Branch Coverage | {branch_rate:.2f}% | Baseline | ℹ️ Reported |')
              print('\n*Threshold enforced: 80% minimum line coverage*')
          except Exception as e:
              print(f'Coverage parsed with note: {e}')
          " >> $GITHUB_STEP_SUMMARY
          fi

      - name: Upload backend coverage artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: backend-coverage-report
          path: |
            backend/coverage.xml
            backend/htmlcov/
          if-no-files-found: ignore
