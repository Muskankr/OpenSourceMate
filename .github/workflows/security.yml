name: Security

on:
  pull_request:
    branches: [main]
  push:
    # Keeps the CodeQL baseline on main up to date so pull requests are
    # compared against it.
    branches: [main]
  schedule:
    # Mondays 05:00 UTC. New advisories are published all the time, so the
    # dependency scans also run when nobody has opened a pull request.
    - cron: "0 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  npm-audit:
    name: npm audit (frontend)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # Blocking: high or critical advisories in packages that ship with the app.
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      # Not blocking: the same check including dev tools (eslint, jest, ...).
      # Findings show up as a warning on the job and are triaged as issues.
      - name: Audit all dependencies (report only)
        continue-on-error: true
        run: npm audit --audit-level=high

  pip-audit:
    name: pip-audit (backend)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pip-audit
        run: python -m pip install "pip-audit>=2.9,<3"

      # Blocking: any known vulnerability in backend/requirements.txt (and what
      # it pulls in) that is not on the list below.
      #
      # The ignored ids are all in starlette 0.37.2, which comes in through the
      # pinned fastapi==0.111.0. Fixing them needs a fastapi upgrade, so they are
      # tracked in a follow-up issue instead of being fixed here. Remove an id
      # from this list when its fix lands, and do not add new ids without a
      # tracking issue. See docs/security-scanning.md.
      - name: Audit backend requirements
        run: |
          pip-audit -r backend/requirements.txt --progress-spinner off \
            --ignore-vuln PYSEC-2026-1943 \
            --ignore-vuln PYSEC-2026-1941 \
            --ignore-vuln PYSEC-2026-161 \
            --ignore-vuln PYSEC-2026-2281 \
            --ignore-vuln PYSEC-2026-2280 \
            --ignore-vuln PYSEC-2026-249 \
            --ignore-vuln PYSEC-2026-248

  bandit:
    name: Bandit (backend)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Bandit
        run: python -m pip install "bandit>=1.8,<2"

      # Blocking: medium and high severity findings (-ll). Low severity
      # findings are printed in the next step but do not fail the job.
      - name: Scan backend/app (medium and above)
        run: bandit -r backend/app -ll

      - name: Scan backend/app (all severities, report only)
        continue-on-error: true
        run: bandit -r backend/app --exit-zero

  codeql:
    name: CodeQL (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 30

    permissions:
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        language: [python, javascript-typescript]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          languages: ${{ matrix.language }}
          build-mode: none

      - name: Analyze
        uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          category: "/language:${{ matrix.language }}"
